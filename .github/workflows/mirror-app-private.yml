name: Mirror app_private

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[mirror-sync]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror current app_private main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .mirror-source
          git clone --depth 1 --branch main https://github.com/Gowtham518250/app_private.git .mirror-source
          rm -rf .mirror-source/.git
          # GitHub Apps may not have the workflow scope required to push
          # workflow files. Preserve source workflows under a backup-only path.
          if [ -d .mirror-source/.github/workflows ]; then
            mkdir -p _source_github/workflows
            cp -a .mirror-source/.github/workflows/. _source_github/workflows/
          fi
          rm -rf .mirror-source/.github
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .mirror-source -exec rm -rf {} +
          cp -a .mirror-source/. .
          rm -rf .mirror-source

      - name: Commit mirrored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Backup already matches app_private/main."
            exit 0
          fi
          git commit -m "[mirror-sync] Backup app_private main"
          git push origin HEAD:main
